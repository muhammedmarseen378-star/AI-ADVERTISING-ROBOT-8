<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | AI Advertisement Robot</title>
  <link rel="stylesheet" href="src/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #0a1835 0%, #03060e 80%);
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-surface, #0f172a);
      border: 1px solid var(--border-color, rgba(0, 240, 255, 0.2));
      border-radius: var(--radius-lg, 12px);
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 240, 255, 0.15);
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 44px;
    }
    .btn-toggle-password {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-muted, #94a3b8);
      cursor: pointer;
      font-size: 18px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .btn-toggle-password:hover {
      color: var(--cyan-primary, #00f0ff);
    }
    .quick-fill-hint {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim, #64748b);
    }
    .quick-fill-link {
      color: var(--cyan-primary, #00f0ff);
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="logo-badge" style="margin: 0 auto 16px; width: 52px; height: 52px; font-size: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff;">🛡️</div>
      <h1 style="font-size: 22px; font-weight: 800; color: #fff; margin: 0;">Administrator Login</h1>
      <p style="font-size: 13px; color: var(--text-muted, #94a3b8); margin-top: 6px;">
        Autonomous AI Advertisement Robot Platform
      </p>
    </div>

    <div id="login-alert" style="display: none; padding: 12px; border-radius: var(--radius-sm, 6px); margin-bottom: 20px; font-size: 13px;"></div>

    <form id="form-login" autocomplete="on">
      <div class="form-group" style="margin-bottom: 18px;">
        <label class="form-label" style="display: block; font-size: 12px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Administrator Email</label>
        <input 
          type="email" 
          id="login-email" 
          class="form-control" 
          placeholder="Enter administrator email" 
          required 
          autofocus
          autocomplete="username"
        >
        <div class="quick-fill-hint">
          <span>Type your admin email</span>
          <span class="quick-fill-link" id="btn-quick-fill">Auto-fill default admin</span>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label class="form-label" style="display: block; font-size: 12px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Password</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="Enter administrator password" 
            required 
            minlength="6"
            autocomplete="current-password"
          >
          <button type="button" id="btn-toggle-password" class="btn-toggle-password" title="Show or hide password" aria-label="Toggle password visibility">
            <span id="eye-icon">👁️</span>
          </button>
        </div>
      </div>

      <!-- Cloudflare Worker API URL Setting -->
      <div class="form-group" style="margin-bottom: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" style="margin: 0; font-size: 12px; color: #94a3b8;">Cloudflare Worker API URL (Optional)</label>
          <a href="#" id="toggle-api-url" style="font-size: 11px; color: var(--cyan-primary, #00f0ff); text-decoration: none;">⚙️ Set URL</a>
        </div>
        <input type="text" id="worker-api-url" class="form-control" placeholder="https://advertising-robot.muhammedmarseen378.workers.dev" style="display: none; font-size: 12px; font-family: monospace;">
      </div>

      <!-- Password Setup Key (Only shown when initial bootstrap is needed) -->
      <div id="setup-key-group" class="form-group" style="display: none; margin-bottom: 18px;">
        <label class="form-label" style="display: block; font-size: 12px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Master Setup Secret Key</label>
        <input type="password" id="login-setup-key" class="form-control" placeholder="Enter master setup key">
        <small style="color: var(--text-dim, #64748b); font-size: 11px;">Required for first-time password initialization.</small>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 13px; font-size: 14px; font-weight: 700;">
        Sign In to Admin Dashboard
      </button>

      <div style="margin-top: 20px; text-align: center;">
        <a href="#" id="toggle-setup-mode" style="font-size: 12px; color: var(--text-muted, #94a3b8); text-decoration: none;">
          First time setup? Click here to set up password
        </a>
      </div>
    </form>
  </div>

  <script type="module">
    import { apiLogin, apiSetupPassword, setAdminToken, setApiBase, getApiBase } from './src/api.js';

    let isSetupMode = false;
    const form = document.getElementById('form-login');
    const alertBox = document.getElementById('login-alert');
    const btnSubmit = document.getElementById('btn-submit');
    const setupGroup = document.getElementById('setup-key-group');
    const toggleSetup = document.getElementById('toggle-setup-mode');
    const apiUrlInput = document.getElementById('worker-api-url');
    const toggleApiUrl = document.getElementById('toggle-api-url');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const btnTogglePassword = document.getElementById('btn-toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const btnQuickFill = document.getElementById('btn-quick-fill');

    // Pre-populate API base URL
    apiUrlInput.value = getApiBase();
    if (window.location.protocol === 'file:') {
      apiUrlInput.style.display = 'block';
    }

    // Auto-login check: If already logged in, skip login screen and open admin dashboard
    const existingToken = getAdminToken();
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('logout')) {
      alertBox.style.display = 'block';
      alertBox.style.background = 'rgba(0, 240, 255, 0.12)';
      alertBox.style.border = '1px solid var(--cyan-primary, #00f0ff)';
      alertBox.style.color = '#fff';
      alertBox.textContent = 'You have been successfully logged out.';
    } else if (existingToken) {
      window.location.href = 'admin.html';
    }

    // Quick fill helper
    if (btnQuickFill) {
      btnQuickFill.addEventListener('click', () => {
        emailInput.value = 'nttf.ttc.m3b.group1.project@gmail.com';
        passwordInput.value = 'group_1@nttf';
        passwordInput.focus();
      });
    }

    // Password visibility toggle (Eye Icon)
    btnTogglePassword.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = '🙈';
        btnTogglePassword.title = 'Hide password';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = '👁️';
        btnTogglePassword.title = 'Show password';
      }
    });

    toggleApiUrl.addEventListener('click', (e) => {
      e.preventDefault();
      apiUrlInput.style.display = apiUrlInput.style.display === 'none' ? 'block' : 'none';
    });

    toggleSetup.addEventListener('click', (e) => {
      e.preventDefault();
      isSetupMode = !isSetupMode;
      if (isSetupMode) {
        setupGroup.style.display = 'block';
        btnSubmit.textContent = 'Configure Administrator Password';
        toggleSetup.textContent = 'Already configured? Return to Sign In';
      } else {
        setupGroup.style.display = 'none';
        btnSubmit.textContent = 'Sign In to Admin Dashboard';
        toggleSetup.textContent = 'First time setup? Click here to set up password';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Authenticating...';

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const setupKey = (document.getElementById('login-setup-key')?.value || '').trim();

      if (apiUrlInput.value.trim()) {
        setApiBase(apiUrlInput.value.trim());
      }

      try {
        if (isSetupMode) {
          const res = await apiSetupPassword(email, password, setupKey);
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(0, 230, 118, 0.15)';
          alertBox.style.border = '1px solid var(--success, #00e676)';
          alertBox.style.color = '#fff';
          alertBox.textContent = res.message || 'Password configured successfully! Please sign in.';
          isSetupMode = false;
          setupGroup.style.display = 'none';
          btnSubmit.textContent = 'Sign In to Admin Dashboard';
        } else {
          // Fail-safe admin login
          const res = await apiLogin(email, password);
          if (res && res.token) {
            setAdminToken(res.token);
            window.location.href = 'admin.html';
            return;
          }
          throw new Error('Invalid administrator credentials.');
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(255, 23, 68, 0.15)';
        alertBox.style.border = '1px solid var(--danger, #ff1744)';
        alertBox.style.color = '#ff8080';
        alertBox.textContent = err.message || 'Invalid administrator credentials.';
      } finally {
        btnSubmit.disabled = false;
        if (!isSetupMode) btnSubmit.textContent = 'Sign In to Admin Dashboard';
      }
    });
  </script>

</body>
</html>
