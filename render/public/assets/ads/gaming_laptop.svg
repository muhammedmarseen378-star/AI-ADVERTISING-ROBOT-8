<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0817"/>
      <stop offset="60%" stop-color="#160e35"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="600" fill="url(#bg2)"/>
  <rect x="60" y="45" width="220" height="34" rx="17" fill="rgba(176,38,255,0.2)" stroke="#b026ff" stroke-width="1.5"/>
  <text x="80" y="67" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">HIGH PERFORMANCE</text>
  
  <text x="60" y="140" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">TITAN X-PRO WORKSTATION</text>
  <text x="60" y="190" fill="url(#purpleGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">Intel i9 14th Gen • NVIDIA RTX 4070</text>
  <text x="60" y="240" fill="#a0aec0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Uncompromised computing for AI developers, mechanical CAD designers, and hardcore gamers.</text>
  
  <g transform="translate(60, 280)">
    <rect width="480" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(176,38,255,0.3)"/>
    <text x="30" y="45" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚡ 32GB High-speed DDR5 5600MHz RAM</text>
    <text x="30" y="85" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚡ 1TB Gen4 Ultra NVMe SSD Storage</text>
    <text x="30" y="125" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚡ 16.1" QHD 165Hz 100% sRGB Color Calibrated</text>
    <text x="30" y="160" fill="#ffd200" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">PRICE: ₹89,999</text>
  </g>

  <!-- Laptop silhouette -->
  <g transform="translate(620, 210)">
    <rect x="0" y="0" width="340" height="200" rx="10" fill="#111" stroke="#00f0ff" stroke-width="2"/>
    <rect x="15" y="15" width="310" height="170" fill="#1b1238"/>
    <text x="75" y="105" fill="#b026ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">TITAN X-PRO</text>
    <polygon points="0,200 340,200 380,240 -40,240" fill="#222" stroke="#444"/>
  </g>
  
  <rect x="60" y="505" width="904" height="55" rx="10" fill="#00f0ff"/>
  <text x="85" y="539" fill="#000000" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">CAMPUS PROMO: Free Mechanical Keyboard + Gaming Mouse worth ₹5,999!</text>
</svg>
