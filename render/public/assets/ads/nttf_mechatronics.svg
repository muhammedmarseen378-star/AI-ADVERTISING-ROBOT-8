<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="50%" stop-color="#091834"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#f7971e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="600" fill="url(#bg)"/>
  <circle cx="900" cy="120" r="300" fill="#00f0ff" opacity="0.06"/>
  <circle cx="100" cy="500" r="250" fill="#0072ff" opacity="0.08"/>
  
  <!-- Header Badge -->
  <rect x="60" y="45" width="280" height="36" rx="18" fill="rgba(0,240,255,0.15)" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="75" y="68" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" letter-spacing="2">ADMISSIONS OPEN • 2026</text>
  
  <!-- Title -->
  <text x="60" y="140" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">NTTF TECHNICAL TRAINING CENTRE</text>
  <text x="60" y="195" fill="url(#cyanGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">Diploma in Mechatronics &amp; Robotics</text>
  
  <!-- Description -->
  <text x="60" y="245" fill="#a0aec0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Hands-on Industrial Automation, Embedded AI, PLC, and IoT Systems.</text>
  <text x="60" y="275" fill="#a0aec0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Guaranteed placement assistance with global engineering leaders.</text>
  
  <!-- Highlights Card -->
  <g transform="translate(60, 320)">
    <rect width="520" height="150" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(0,240,255,0.25)" stroke-width="1"/>
    <circle cx="35" cy="40" r="14" fill="#00f0ff" opacity="0.2"/>
    <text x="30" y="45" fill="#00f0ff" font-size="14">✓</text>
    <text x="65" y="45" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Advanced Industrial Robotics &amp; AGV Labs</text>
    
    <circle cx="35" cy="85" r="14" fill="#00f0ff" opacity="0.2"/>
    <text x="30" y="90" fill="#00f0ff" font-size="14">✓</text>
    <text x="65" y="90" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">100% Practical Industry-Aligned Curriculum</text>
    
    <circle cx="35" cy="130" r="14" fill="#00f0ff" opacity="0.2"/>
    <text x="30" y="135" fill="#00f0ff" font-size="14">✓</text>
    <text x="65" y="135" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Over 95% Verified Campus Placements</text>
  </g>
  
  <!-- Visual Graphic (Robot Arm Graphic) -->
  <g transform="translate(670, 180)">
    <circle cx="160" cy="160" r="140" fill="rgba(0,240,255,0.04)" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="160" cy="160" r="105" fill="rgba(0,114,255,0.08)"/>
    <!-- Abstract Arm -->
    <rect x="150" y="100" width="20" height="90" rx="8" fill="url(#cyanGrad)"/>
    <circle cx="160" cy="190" r="18" fill="#ffd200"/>
    <rect x="153" y="190" width="14" height="70" rx="6" fill="#00f0ff" transform="rotate(-35 160 190)"/>
    <circle cx="120" cy="245" r="12" fill="#ffffff"/>
    <text x="80" y="325" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">MECHATRONICS 4.0</text>
  </g>
  
  <!-- Footer Offer Banner -->
  <rect x="60" y="505" width="904" height="55" rx="10" fill="url(#accent)"/>
  <text x="85" y="539" fill="#000000" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">SCHOLARSHIP OFFER: ₹10,000 Early Bird Fee Concession for Top Rankers!</text>
</svg>
